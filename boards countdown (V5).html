<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boards 2027 Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--card:#131317;--line:#24242b;--text:#f4f4f6;--dim:#8b8b97;--accent:#6c8cff}
body[data-phase=focus]{--accent:#a07cff}
body[data-phase=serious]{--accent:#ffa94d}
body[data-phase=intense]{--accent:#ff5c6c}
body[data-phase=showtime],body[data-phase=done]{--accent:#ff3347}
*{box-sizing:border-box;margin:0}
body{font-family:Sora,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(1.5rem,env(safe-area-inset-top)) 1.25rem max(1.5rem,env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
main{width:100%;max-width:880px;display:flex;flex-direction:column;align-items:center;gap:2.2rem;text-align:center}
h1{white-space:nowrap;font-weight:600;font-size:clamp(1.1rem,6vw,3rem);letter-spacing:-.03em;background:linear-gradient(90deg,#2ee6c5,#5ab0ff 55%,#c58bff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding-bottom:.1em}
.badge{display:inline-flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:.4rem .9rem;transition:.6s}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);transition:background .6s}
.live{width:100%;display:flex;flex-direction:column;align-items:center;gap:1.6rem}
.timer{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(1rem,4vw,2rem) .3rem clamp(.8rem,3vw,1.4rem);transition:border-color .6s}
.box:first-child{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.num{display:block;font-weight:300;font-size:clamp(2rem,9.5vw,5rem);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;overflow:hidden}
.box:first-child .num{color:var(--accent);font-weight:400;transition:color .6s}
.lbl{display:block;margin-top:.7rem;font-size:clamp(.65rem,2.4vw,.8rem);color:var(--dim)}
.tick{animation:tick .4s ease}
@keyframes tick{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
.left{font-size:clamp(.95rem,3vw,1.15rem);font-weight:600;letter-spacing:.35em;color:var(--accent);padding-left:.35em;transition:color .6s}
.bar{width:min(420px,100%);height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width 1.2s,background .6s}
.stats{font-size:.82rem;color:var(--dim)}
.msg{color:var(--text);font-weight:300;font-size:clamp(1rem,3.4vw,1.25rem);min-height:1.5em}
.snd{position:fixed;top:max(1rem,env(safe-area-inset-top));right:1rem;width:40px;height:40px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);border-radius:50%;color:var(--dim);cursor:pointer;transition:.3s;z-index:2}
.snd:hover{color:var(--text);border-color:var(--accent)}
.snd svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snd .on{display:none}.snd.is-on .on{display:inline}.snd.is-on .off{display:none}.snd.is-on{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.done{display:none}
.done h2{font-weight:600;font-size:clamp(2rem,8vw,4.2rem);line-height:1.12;letter-spacing:-.03em;animation:reveal 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes reveal{from{opacity:0;transform:translateY(24px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
body[data-phase=done] .live{display:none}body[data-phase=done] .done{display:block}
body[data-phase=showtime] .box:last-child{animation:beat 1s infinite}
@keyframes beat{50%{border-color:var(--accent)}}
@media (max-width:480px){.timer{grid-template-columns:repeat(2,1fr)}.num{font-size:clamp(2.6rem,17vw,4rem)}main{gap:1.8rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-phase="calm">
<button class="snd" id="snd" aria-label="Turn sound on" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><g class="on"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
<main>
  <h1>Boards 2027 Countdown</h1>
  <div class="badge" id="badge">Calm</div>
  <div class="live">
    <div class="timer" id="timer"></div>
    <div class="left">TO GO</div>
    <div class="bar"><i id="fill"></i></div>
    <div class="stats" id="stats"></div>
    <p class="msg" id="msg"></p>
  </div>
  <div class="done"><h2>Your exams have finally arrived. Are you ready?</h2></div>
</main>
<script>
// ---- Edit these if the date/time changes ----
const EXAM = new Date('2027-02-16T00:00:00');
const START = new Date('2026-11-07T00:00:00');
// ---------------------------------------------
const PHASES = {
  calm:['Calm',['Plenty of time. Build good habits.','Small steps every day add up.','Understand it now, revise it later.']],
  focus:['Focus',['Consistency beats cramming.','Pick your weak topics and fix them.','Practice past papers weekly.']],
  serious:['Serious',['Revise. Practice. Repeat.','Every mock paper counts.','Sleep well. Revise smart.']],
  intense:['Intense',['Every hour counts now.','No more postponing.','Revise what you know cold.']],
  showtime:['Final days',['You have done the work. Trust it.','Stay calm. Stay sharp.','Almost there.']],
  done:['Exam day',[]]
};
const $ = id => document.getElementById(id);
const units = ['Days','Hours','Minutes','Seconds'];
$('timer').innerHTML = units.map(u => `<div class="box"><span class="num" id="n${u}">00</span><span class="lbl">${u}</span></div>`).join('');
// ---- Sound (plays by default once you tap or press anything on the page) ----
let ac, sa, ready = false;
function unlock(){ // lets sound play on iPhones even with the silent switch on
  try { if (!sa){ const n = 800, b = new Uint8Array(44+n), v = new DataView(b.buffer), w = (o,t) => [...t].forEach((c,i) => v.setUint8(o+i,c.charCodeAt(0)));
    w(0,'RIFF'); v.setUint32(4,36+n,true); w(8,'WAVEfmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,'data'); v.setUint32(40,n,true); b.fill(128,44);
    sa = new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'}))); sa.loop = true; }
    sa.play().catch(()=>{}); } catch(e){}
}
function ctx(){ ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state !== 'running') ac.resume(); return ac; }
function tone(f, t0, dur, vol){ const c = ctx(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
  o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05); }
const sfx = {
  tick(){ tone(880, 0, .12, .05); },  // soft tick, like a marimba
};
let muted = false; try { muted = localStorage.getItem('muted') === '1'; } catch(e){}
const active = () => !muted && ac && ac.state === 'running';
function paintSnd(){ const b = $('snd'), on = active(); b.classList.toggle('is-on', on); b.setAttribute('aria-pressed', !!on); b.setAttribute('aria-label', on ? 'Mute sound' : 'Turn sound on'); }
$('snd').onclick = () => {
  if (active()) { muted = true; try { localStorage.setItem('muted', '1'); } catch(e){} }
  else { muted = false; try { localStorage.setItem('muted', '0'); } catch(e){} arm(); ctx().resume().then(paintSnd); }
  paintSnd();
};
paintSnd();
function play(n){ paintSnd(); if (muted) return; try { const c = ctx(); if (c.state === 'running') sfx[n](); } catch(e){} } // retries to start audio every second; plays as soon as the browser allows
function arm(){ if (!ready){ ready = true; unlock(); } ctx(); }
['pointerdown','click','keydown','touchend'].forEach(e => addEventListener(e, ev => { if (!(ev.target.closest && ev.target.closest('#snd'))) { arm(); setTimeout(paintSnd, 150); } }, {passive:true}));
// -----------------------------------------------------------
let offset = 0, last = '', prev = {};
const pad = n => String(n).padStart(2,'0');
const phaseOf = (d, ms) => ms <= 0 ? 'done' : d > 60 ? 'calm' : d > 30 ? 'focus' : d > 14 ? 'serious' : d > 3 ? 'intense' : 'showtime';
function set(id, v){
  const el = $('n'+id), s = id === 'Days' ? String(v) : pad(v);
  if (prev[id] !== s){ el.textContent = s; el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); prev[id] = s; }
}
function render(){
  const now = Date.now() + offset, ms = EXAM - now, t = Math.max(0, ms);
  const d = Math.floor(t/864e5), h = Math.floor(t/36e5)%24, m = Math.floor(t/6e4)%60, s = Math.floor(t/1e3)%60;
  const ph = phaseOf(Math.ceil(t/864e5), ms);
  if (ph !== last){
    last = ph; document.body.dataset.phase = ph; $('badge').textContent = PHASES[ph][0];
    const L = PHASES[ph][1]; $('msg').textContent = L.length ? L[Math.floor(now/864e5) % L.length] : '';
  }
  set('Days',d); set('Hours',h); set('Minutes',m); set('Seconds',s);
  if (ph !== 'done') play('tick');
  const pct = Math.min(100, Math.max(0, (now - START) / (EXAM - START) * 100));
  $('fill').style.width = pct.toFixed(1) + '%';
  $('stats').textContent = `${Math.floor(d/7)} weeks, ${d%7} days · ${pct.toFixed(0)}% of the way there`;
}
setInterval(render, 1000); render();
</script>
</body>
</html>
